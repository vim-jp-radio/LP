name: lint / check

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  lint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v6.0.6
        with:
          standalone: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run check
        run: pnpm check
      - name: Run lint
        run: |
          pnpm lint
          pnpm lint:renovate

  secretlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: pnpm/action-setup@v6.0.6
        with:
          standalone: true
      - name: Run secretlint
        shell: bash
        run: pnpm dlx @secretlint/quick-start ./**/*
